<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <body>

        <!-- fragmento para buscar productos -->
        <section th:fragment="buscar" class="container pt-4">
            <form method="get" th:action="@{/producto/}">
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" name="descripcion" th:value="${descripcion}" class="form-control" placeholder="Buscar productos"/>
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </div>
            </form>
        </section>

        <!-- fragmento 1 para mostrar unos tabs con categorías -->
        <section th:fragment="tabs" class="py-3 mb-4">
            <div class="d-flex justify-content-center px-5">
                <ul class="nav nav-underline">

                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" th:href="@{/producto/}">[[#{pruebas.todas}]]</a>
                    </li>

                    <li th:each="c : ${categorias}" class="nav-item">
                        <a class="nav-link" th:href="@{/producto/consultas/{id}(id=${c.idCategoria})}">[[${c.descripcion}]]</a>
                    </li>

                </ul>
            </div>
        </section>

        <!-- fragmento 2 para el listado de productos en formato de tarjetas -->
        <section th:fragment="tarjetas" class="container py-4">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">

                <div th:each="p : ${productos}" class="col">
                    <div class="card h-100 shadow">

                        <div class="d-flex justify-content-center align-items-center bg-light p-3" style="height: 200px;">
                            <img th:src="${p.rutaImagen}" class="img-fluid" th:alt="${p.descripcion}" style="max-height: 100%; object-fit: contain;"/>
                        </div>

                        <div class="card-header bg-white">
                            <h5 class="card-title text-center text-truncate mb-0">[[${p.descripcion}]]</h5>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <p class="card-text text-muted mb-auto text-truncate">[[${p.detalle}]]</p>
                        </div>

                        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                            <div class="fw-bold">
                                <span class="text-success h5">[[${#numbers.formatCurrency(p.precio).replace('$','₡')}]]</span>
                                <span th:if="${p.existencias != null and p.existencias > 0}" class="badge text-bg-success ms-2">[[${p.existencias}]] unidades</span>
                                <span th:unless="${p.existencias != null and p.existencias > 0}" class="badge text-bg-danger ms-2">Agotado!</span>
                            </div>

                            <form sec:authorize="isAuthenticated()"
                                  th:action="@{/carrito/agregar/{id}(id=${p.idProducto})}"
                                  method="post">
                                <button type="submit"
                                        class="btn btn-success btn-sm"
                                        th:disabled="${p.existencias == null or p.existencias <= 0}">
                                    <i class="fa-solid fa-cart-plus"></i> Agregar
                                </button>
                            </form>
                        </div>

                    </div>
                </div>

            </div>
        </section>

        <!-- fragmento 3 para mostrar el formulario de la consulta derivada -->
        <section th:fragment="consultas" class="row justify-content-center p-2">
            <div class="col-md-5" th:replace="~{consultas/fragmentos :: formConsulta('primary',#{consultas.derivadas},'/consultas/consultaDerivada')}"></div>
        </section>

        <!-- fragmento 4 para realizar la consulta -->
        <section th:fragment="formConsulta(colorForm, textForm, urlForm)">
            <form method="post" class="was-validated" th:action="@{${urlForm}}">
                <div class="card p-2">

                    <div class="card-header text-center text-white" th:classappend="${'bg-' + colorForm}">
                        <h5>[[${textForm}]]</h5>
                    </div>

                    <div class="card-body">

                        <div class="mb-3">
                            <label>[[#{consultas.precio.inferior}]]</label>
                            <input type="number" name="precioInf" th:value="${precioInf}" class="form-control" min="0" step="0.01" required/>
                        </div>

                        <div class="mb-3">
                            <label>[[#{consultas.precio.superior}]]</label>
                            <input type="number" name="precioSup" th:value="${precioSup}" class="form-control" min="0" step="0.01" required/>
                        </div>

                    </div>

                    <div class="card-footer text-center">
                        <button type="submit" class="btn text-white" th:classappend="${'btn-' + colorForm}">
                            <i class="fa-solid fa-magnifying-glass"></i> [[${textForm}]]
                        </button>
                    </div>

                </div>
            </form>
        </section>

    </body>
</html>
