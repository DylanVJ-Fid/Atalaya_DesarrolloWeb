<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}">
    <title>Atalaya</title>
</head>

<body>

    <header th:replace="~{general/fragmentos :: header}"></header>

    <section class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card text-center">

                    <div class="card-header">
                        <h3>Verifica tu correo</h3>
                    </div>

                    <div class="card-body">

                        <p class="mb-3">
                            Hemos enviado un correo de verificación a:
                        </p>

                        <p>
                            <strong th:text="${correo}"></strong>
                        </p>

                        <p class="mt-3">
                            Revisa tu bandeja de entrada y haz clic en
                            <strong>Configurar mi cuenta</strong>
                            para terminar de crear tu cuenta.
                        </p>

                        <a href="https://mail.google.com/"
                           target="_blank"
                           class="btn btn-success mt-3">
                            Abrir correo
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>

</html>
