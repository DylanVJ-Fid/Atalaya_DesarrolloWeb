<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
        <title>Atalaya</title>
    </head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <section class="container mt-4">

            <div class="row justify-content-center">
                <div class="col-md-6">

                    <div class="card">

                        <div class="card-header">
                            <h4>Configurar mi cuenta</h4>
                        </div>

                        <div class="card-body">

                            <form method="POST"
                                  th:action="@{/registro/activar}"
                                  th:object="${usuario}">

                                <input type="hidden"
                                       th:field="*{idUsuario}"/>

                                <input type="hidden"
                                       name="claveActivacion"
                                       th:value="${claveActivacion}"/>

                                <div class="mb-3">
                                    <label class="form-label">Nombre</label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           required/>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Correo</label>

                                    <input type="email"
                                           class="form-control"
                                           th:field="*{correo}"
                                           readonly/>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Nueva contraseña</label>

                                    <input type="password"
                                           class="form-control"
                                           name="nuevaPassword"
                                           required/>
                                </div>

                                <button type="submit"
                                        class="btn btn-success">
                                    Activar cuenta
                                </button>

                            </form>

                        </div>

                    </div>

                </div>
            </div>

        </section>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
